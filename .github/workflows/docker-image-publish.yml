name: Update Docker Hub images

on:
  push:
    branches:
      - stable
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false # a skipped (no [Build]) run must not cancel a running build

jobs:
  build:
    name: Update Docker Hub images
    runs-on: ubuntu-22.04
    # Pushes are only built when the head commit message contains [Build]
    if: github.ref == 'refs/heads/stable' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[Build]'))

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.docker_username }}
          DOCKER_PASSWORD: ${{ secrets.docker_password }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo ENABLED=true >> $GITHUB_OUTPUT
          else
            echo "::warning::Docker Hub credentials (docker_username / docker_password) are not available, only publishing to GHCR"
            echo ENABLED=false >> $GITHUB_OUTPUT
          fi

      - name: Login to DockerHub
        if: steps.dockerhub.outputs.ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get name of Docker repository name
        id: docker-repo-name
        run: echo NAME=$(echo "${GITHUB_REPOSITORY,,}") >> $GITHUB_OUTPUT

      # e.g. 5.50.0-dev while IS_DEVELOPMENT_BUILD is true, 5.50.0 otherwise
      - name: Get version and tags
        id: version
        run: |
          BASE_VERSION=$(sed -nE 's/.*const BASE_VERSION = "([^"]+)".*/\1/p' src/VersionInfo.php)
          IS_DEV=$(sed -nE 's/.*const IS_DEVELOPMENT_BUILD = (true|false);.*/\1/p' src/VersionInfo.php)
          if [ -z "$BASE_VERSION" ] || [ -z "$IS_DEV" ]; then
            echo "Failed to read BASE_VERSION / IS_DEVELOPMENT_BUILD from src/VersionInfo.php"
            exit 1
          fi
          VERSION="$BASE_VERSION"
          if [ "$IS_DEV" = "true" ]; then
            VERSION="$VERSION-dev"
          fi

          NAME="${{ steps.docker-repo-name.outputs.NAME }}"
          REGISTRIES="ghcr.io/$NAME"
          if [ "${{ steps.dockerhub.outputs.ENABLED }}" = "true" ]; then
            REGISTRIES="$NAME $REGISTRIES"
          fi

          # <version> is overwritten on every build, <version>-<sha> never is
          {
            echo "TAGS<<EOF"
            for REGISTRY in $REGISTRIES; do
              echo "$REGISTRY:$VERSION"
              echo "$REGISTRY:$VERSION-${GITHUB_SHA::7}"
              echo "$REGISTRY:latest"
            done
            echo "EOF"
            echo "ARTIFACT_NAME=PocketMine-MP-$VERSION-${GITHUB_SHA::7}"
          } >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          file: ./docker/Dockerfile
          tags: ${{ steps.version.outputs.TAGS }}
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:buildcache,mode=max

      # Everything is cached by now, so this only exports the phar
      - name: Export PocketMine-MP.phar
        uses: docker/build-push-action@v7.4.0
        with:
          push: false
          file: ./docker/Dockerfile
          target: phar
          outputs: type=local,dest=out
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.docker-repo-name.outputs.NAME }}:buildcache

      - name: Upload PocketMine-MP.phar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.ARTIFACT_NAME }}
          path: out/PocketMine-MP.phar
          if-no-files-found: error
